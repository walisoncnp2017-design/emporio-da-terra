<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar Pedido - Empório da Terra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .topo {
            background: #252525;
            color: white;
            padding: 18px 40px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .finalizar {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #25D366;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .finalizar:hover {
            background: #1ebe5d;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <header class="topo">
        <h2>🛒 Empório da Terra</h2>
    </header>

    <main class="container">

        <h1>📋 Finalizar Pedido</h1>

        <form action="/enviar_pedido" method="POST">

            <label for="nome">
                Nome:
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >


            <label for="endereco">
                Endereço de entrega:
            </label>

            <input
                type="text"
                id="endereco"
                name="endereco"
                placeholder="Rua, número, bairro..."
                required
            >


            <label for="pagamento">
                Forma de pagamento:
            </label>

            <select id="pagamento" name="pagamento" required>

                <option value="">
                    Selecione
                </option>

                <option value="Pix">
                    Pix
                </option>

                <option value="Dinheiro">
                    Dinheiro
                </option>

                <option value="Cartão de crédito">
                    Cartão de crédito
                </option>

                <option value="Cartão de débito">
                    Cartão de débito
                </option>

            </select>


            <label for="observacao">
                Observação:
            </label>

            <textarea
                id="observacao"
                name="observacao"
                placeholder="Alguma informação sobre o pedido?"
            ></textarea>


            <button type="submit" class="finalizar">
                🟢 Enviar pedido pelo WhatsApp
            </button>

        </form>


        <a href="/carrinho" class="voltar">
            ← Voltar para o carrinho
        </a>

    </main>

</body>

</html>
